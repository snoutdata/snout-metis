[package]
name = "snout-metis"
description = "snout-metis: placement and routing for the stack's services. Decides which copies of which services run on which hosts, and the routing table every proxy balances calls from."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snoutdata/snout-metis"
rust-version = "1.98.1"
publish = false

[lib]
name = "metis"
path = "src/lib.rs"

[[bin]]
name = "snout-metis"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The members (src/member/): openraft for the majority (MIT OR Apache-2.0), HTTP between them
# and to the agents, the same axum, reqwest and tokio the other components use.
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Members can serve their agents over TLS on a public address (`agent_tls`): the same rustls the router uses, and hyper under axum for the accept loop.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# A spec agent's token is checked by its sha256, with the ring rustls already brings.
ring = "0.17"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
tempfile = "3"


# Written out from the stack's workspace, which this crate is published from.
[lints.rust]
# X13: no `unsafe` outside the pgrx boundary. The three extensions under ext/ opt out in
# their own Cargo.toml when pgrx arrives, and nowhere else may.
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# For iterating on a build host: release speed without fat LTO's link time. Numbers that are
# reported (sizes, the bench) come from `release`, never from this.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

# Its own workspace: this repository is not part of any other.
[workspace]
